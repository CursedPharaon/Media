<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест Supabase</title>
</head>
<body>
    <h2>Тест авторизации Supabase</h2>
    <input type="email" id="email" placeholder="Email" style="width: 250px;"><br><br>
    <input type="password" id="password" placeholder="Пароль (мин 6)" style="width: 250px;"><br><br>
    <button onclick="testRegister()">Зарегистрироваться</button>
    <button onclick="testLogin()">Войти</button>
    <button onclick="testLogout()">Выйти</button>
    <pre id="result" style="background:#f0f0f0; padding:10px; margin-top:20px;"></pre>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⚠️ ЗАМЕНИТЕ НА ВАШИ ДАННЫЕ!
        const SUPABASE_URL = 'https://ВАШ_ПРОЕКТ.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
        const result = document.getElementById('result')

        function log(msg) {
            result.textContent += msg + '\n'
            console.log(msg)
        }

        async function testRegister() {
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            log('→ Регистрация: ' + email)
            
            const { data, error } = await supabase.auth.signUp({ email, password })
            if (error) log('❌ Ошибка: ' + error.message)
            else log('✅ Регистрация успешна! Проверьте почту (если требуется подтверждение)')
        }

        async function testLogin() {
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            log('→ Вход: ' + email)
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password })
            if (error) log('❌ Ошибка: ' + error.message)
            else {
                log('✅ Вход выполнен! User ID: ' + data.user.id)
                log('Email подтверждён: ' + data.user.email_confirmed_at)
            }
        }

        async function testLogout() {
            await supabase.auth.signOut()
            log('🚪 Выход выполнен')
        }

        // Проверка подключения при загрузке
        window.onload = () => {
            log('Supabase версия: ' + window.supabase.version)
            log('URL: ' + SUPABASE_URL)
            log('Соединение создано. Попробуйте зарегистрироваться или войти.')
        }
    </script>
</body>
</html>
